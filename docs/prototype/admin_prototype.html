<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin prototype</title>
<style>
:root{--bg:#0A0E17;--s1:#111827;--s2:#182033;--s3:#212B42;--bd:#243049;--bd2:#33415F;--tx:#E9EEF7;--tx2:#A3AFC6;--tx3:#8591AB;--br:#7C83FF;--onbr:#0A0E17;--ok:#34D399;--bad:#F87171;--warn:#FBBF24;--r:12px;--bar:64px}
:root[data-theme=light]{--bg:#F5F7FB;--s1:#FFFFFF;--s2:#F0F3F9;--s3:#E6EBF4;--bd:#E2E8F2;--bd2:#C9D2E3;--tx:#0B1220;--tx2:#475269;--tx3:#5E6A84;--br:#4F46E5;--onbr:#FFFFFF;--ok:#047857;--bad:#B91C1C;--warn:#92400E}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--s1);border-right:1px solid var(--bd);padding:16px 12px 24px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--br);color:var(--onbr);display:grid;place-items:center;font-weight:800}
.grp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border:0;background:none;border-radius:10px;color:var(--tx2);text-align:left}
.nav:hover{background:var(--s2);color:var(--tx)}.nav[aria-current=page]{background:var(--s3);color:var(--tx);font-weight:600}
.dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);min-height:60px}
.top h1{font-size:18px;margin:0;font-weight:650}.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
.page{padding:24px;max-width:1200px;margin:0 auto}
.bar{display:none}
/* ---------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--br);color:var(--onbr);font-weight:600}
.btn.sec{background:var(--s3);color:var(--tx);border-color:var(--bd2)}.btn.gh{background:none;color:var(--tx2);border-color:var(--bd)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--bd);background:var(--s1)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:650}.muted{color:var(--tx2)}.small{font-size:13px;color:var(--tx3)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.studio{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.3px}.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--tx2)}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}
label.f{display:block;margin:0 0 14px}label.f>span{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
input[type=text],input[type=search],select,textarea,input[type=number]{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd2);background:var(--s2)}
textarea{min-height:88px;resize:vertical}input[type=range]{width:100%;min-height:44px}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--tx2);font-weight:600}.seg button[aria-pressed=true]{background:var(--s3);color:var(--tx);box-shadow:0 0 0 1px var(--bd2)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 16px;padding:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:var(--s1);color:var(--tx2);font-weight:600}.tabs button[aria-selected=true]{background:var(--br);color:var(--onbr);border-color:transparent}
.swatch{display:grid;grid-template-columns:44px 1fr 88px;gap:10px;align-items:center;margin-bottom:10px}.swatch input[type=color]{width:44px;height:44px;border:1px solid var(--bd2);border-radius:12px;background:none;padding:2px}
.swatch span{font-size:14px}.swatch input[type=text]{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--bd2);background:var(--s2);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--bd2);flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.sw[aria-checked=true]{background:var(--br)}.sw[aria-checked=true]::after{left:23px}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--bd)}
.warnbox{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.okbox{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd)}td{padding:12px;border-bottom:1px solid var(--bd)}
.cards{display:none}
.navrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.navrow .mv{display:flex;gap:4px}.navrow .mv button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--s2)}
/* ---------- site preview (own variables) */
.pv-wrap{background:repeating-conic-gradient(var(--s2) 0 25%,var(--s1) 0 50%) 0 0/20px 20px;border-radius:16px;padding:16px;display:grid;place-items:start center;overflow:auto}
.pv{--r1:8px;position:relative;width:100%;max-width:100%;border-radius:16px;overflow:hidden;background:var(--p-bg);color:var(--p-text);border:1px solid var(--p-border);font-family:var(--p-font)}
.pv.phone{width:min(360px,100%);height:640px;display:flex;flex-direction:column}
.pv .hd{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--p-s1);border-bottom:1px solid var(--p-border)}.pv .hd b{font-family:var(--p-hfont);font-size:17px}
.pv .hd nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}.pv .hd nav span{padding:6px 10px;border-radius:var(--p-r);color:var(--p-text2);font-size:14px}.pv .hd nav span.on{background:var(--p-s3);color:var(--p-text)}
.pv .body{padding:16px;flex:1;overflow:auto}.pv h3{font-family:var(--p-hfont);font-weight:650;margin:0 0 6px;font-size:22px;letter-spacing:-.2px}
.pv .fx{background:var(--p-s1);border:1px solid var(--p-border);border-radius:var(--p-r2);padding:14px;margin-top:12px}.pv .fx .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:var(--p-onbr);background:var(--p-ok)}
.pv .pb{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;font-weight:var(--p-bw);border-radius:var(--p-br);height:var(--p-bh);padding:0 18px;text-transform:var(--p-case);font-family:inherit}
.pv .pb.p{background:var(--p-brand);color:var(--p-onbr)}.pv .pb.p.outline{background:transparent;color:var(--p-brand);border-color:var(--p-brand)}.pv .pb.p.soft{background:color-mix(in srgb,var(--p-brand) 18%,transparent);color:var(--p-brand)}
.pv .pb.s{background:var(--p-s3);color:var(--p-text);border-color:var(--p-borderS)}.pv .pb.hv:hover{transform:translateY(-1px)}
.pv .btabs{display:flex;background:var(--p-s1);border-top:1px solid var(--p-border);padding:6px 4px calc(6px)}.pv .btabs span{flex:1;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--p-text2);padding:4px 0}.pv .btabs span.on{color:var(--p-brand)}
.pv .btabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pv .badge{font-size:10px;padding:0 5px;border-radius:99px;background:var(--p-brand);color:var(--p-onbr);margin-left:4px}
.pop-modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}.pop{background:var(--p-s1);color:var(--p-text);border:1px solid var(--p-border);border-radius:var(--p-r2);padding:18px;width:min(100%,360px);position:relative}.pop h4{margin:0 0 6px;font-size:18px;font-family:var(--p-hfont)}
.pop .x{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;color:var(--p-text2);font-size:22px}
.pop-banner{position:absolute;left:0;right:0;bottom:0;background:var(--p-s3);border-top:1px solid var(--p-borderS);padding:12px 52px 12px 16px;font-size:14px}
.pop-slide{position:absolute;right:12px;bottom:12px;width:min(280px,calc(100% - 24px))}
/* ---------- More sheet + toast */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.sheet.open{display:flex}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}.sheet header h2{margin:0;font-size:18px;flex:1}
.sheet .sc{overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:grid;justify-items:center;gap:6px;padding:14px 6px;min-height:84px;border-radius:16px;border:1px solid var(--bd);background:var(--s1);text-align:center;font-size:13px;line-height:1.2}
.tile svg.i{width:26px;height:26px;color:var(--br)}.tile[aria-current=page]{border-color:var(--br);background:var(--s2)}
.pin{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);display:grid;place-items:center;color:var(--tx3)}.pin[aria-pressed=true]{background:var(--br);color:var(--onbr);border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--bar) + 20px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:80;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);font-weight:600}.toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:1025px){.toast{bottom:24px}}
/* ---------- phones and small tablets: bottom app bar */
@media (max-width:1024px){
 .app{grid-template-columns:1fr}.rail{display:none}.page{padding:16px;padding-bottom:calc(var(--bar) + 28px + env(safe-area-inset-bottom))}.top{padding:10px 16px}.who .nm{display:none}
 .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--s1) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
 .bar button{flex:1;min-width:0;min-height:52px;border:0;background:none;color:var(--tx2);display:grid;justify-items:center;align-content:center;gap:3px;border-radius:14px;font-size:11px;font-weight:600;position:relative}
 .bar button svg.i{width:24px;height:24px}.bar button[aria-current=page]{color:var(--br)}.bar button[aria-current=page]::before{content:"";position:absolute;top:2px;width:28px;height:3px;border-radius:3px;background:var(--br)}
 .bar .dot{position:absolute;top:2px;right:calc(50% - 22px);margin:0}
 .g4{grid-template-columns:1fr 1fr}.g2,.studio{grid-template-columns:minmax(0,1fr)}
 table.rt{display:none}.cards{display:grid;gap:10px}.cards .card{padding:14px}
}
@media (min-width:640px) and (max-width:1024px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr;gap:10px}.kpi b{font-size:22px}.swatch{grid-template-columns:44px 1fr 78px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Admin menu"></aside>
  <main>
    <div class="top">
      <button class="icon-btn" id="burger" aria-label="Open all tools" style="display:none"></button>
      <h1 id="title">Dashboard</h1><div class="sp"></div>
      <label class="who"><span class="sr">Preview as role</span><select id="role" style="min-height:40px;width:auto"><option value="owner">Owner</option><option value="admin">Admin</option><option value="support">Support</option><option value="analyst">Analyst</option></select></label>
      <button class="icon-btn" id="mode" aria-label="Switch admin light or dark"></button>
    </div>
    <div class="page" id="page" tabindex="-1"></div>
  </main>
</div>
<nav class="bar" id="bar" aria-label="Main"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <header><h2 id="sheetT">All tools</h2><button class="btn sm gh" id="editbar">Customize bar</button><button class="icon-btn" id="closeSheet" aria-label="Close"></button></header>
  <div class="sc"><label class="f"><span class="sr">Search tools</span><input type="search" id="q" placeholder="Search tools"></label><div id="tiles"></div>
  <div class="row" style="margin-top:20px"><button class="btn sec" id="mode2">Dark / light</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const PAIRS=[['text','bg','Text on page',4.5],['text2','bg','Soft text on page',4.5],['text','surface1','Text on cards',4.5],['onBrand','brand','Button text',4.5],['brand','bg','Brand on page',3]];
function problems(){const out=[];for(const m of ['dark','light'])for(const [a,b,l,min] of PAIRS){const r=ratio(st.theme.colors[m][a],st.theme.colors[m][b]);if(r<min)out.push({m,l,r:r.toFixed(1),min})}return out}

function drawTiles(){

 $('#tiles').innerHTML=h||'<p class="muted">Nothing matches.</p>';$('#editbar').textContent=st.edit?'Done':'Customize bar';

 if(d.pin){let tb=tabs();tb=tb.includes(d.pin)?tb.filter(x=>x!==d.pin):[...tb,d.pin];if(tb.length>4){toast('Bottom bar holds 4. Unpin one first.');return}if(tb.length<2){toast('Keep at least 2.');return}st.tabs=tb;drawShell();return drawTiles()}
 if(t.id==='mode'||t.id==='mode2'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return drawShell()}
 if(d.preset){const p=PRESETS[d.preset];st.theme.colors=JSON.parse(JSON.stringify(p.colors));st.theme.radius=p.radius;st.buttons.radius_px=p.btn_radius;st.dirty=true;draw();return toast('Preset applied to the draft')}
 if(d.radius){st.theme.radius=d.radius;st.dirty=true;return draw()} if(d.allow!==undefined){st.theme.allow_toggle=!st.theme.allow_toggle;st.dirty=true;return draw()}
 if(d.bv){st.buttons.variants.primary=d.bv;st.dirty=true;return draw()} if(d.bh){st.buttons.height_px.md=+d.bh;st.dirty=true;return draw()} if(d.upper!==undefined){st.buttons.uppercase=!st.buttons.uppercase;st.dirty=true;return draw()}
 if(d.nv!==undefined){const i=st.nav.items[+d.nv];if(st.nav.mobile_tabs.includes(i.id)&&i.enabled){toast('Remove it from the bar first.');return}i.enabled=!i.enabled;st.dirty=true;return draw()}
 if(d.nu!==undefined||d.nd!==undefined){const k=+(d.nu??d.nd),j=d.nu!==undefined?k-1:k+1,a=st.nav.items;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];st.dirty=true;return draw()}
 if(d.st){st.studioTab=d.st;return draw()} if(d.pm){st.pvMode=d.pm;return draw()} if(d.pd){st.pvDevice=d.pd;return draw()}
 if(t.id==='pub'){st.dirty=false;draw();return toast('Published as version 4. Visitors see it now.')} if(t.id==='prev')return toast('Preview link copied. Works for 30 minutes, not indexed.');
 if(d.pk){st.pop.kind=d.pk;return draw()} if(d.pf!==undefined){st.pop.form=!st.pop.form;return draw()} if(t.id==='ppv'){st.pvPopup=!st.pvPopup;return draw()} if(t.id==='psave')return toast('Saved as a draft. Set it live when you are ready.');
 if(d.tpl){const T={'Sign-up':['Get the weekly forecast','One short e-mail every Friday.','Subscribe'],'Announcement':['New: team pages','See form, goals and fixtures for every team.','Take a look'],'Upgrade':['Go further with Pro','Unlimited finder searches and saved views.','See plans']}[d.tpl];Object.assign(st.pop,{title:T[0],body:T[1],btn:T[2],form:d.tpl==='Sign-up'});return draw()}
 if(t.id==='testmail')return toast('Test e-mail sent through '+st.tr.email+'.'); if(t.id==='addhook')return toast('Public https address only. Secret shown once.'); if(t.id==='upl')return toast('Checked by file content, not file name.');
 if(t.id==='trk'){const on=t.getAttribute('aria-checked')==='true';t.setAttribute('aria-checked',String(!on));return toast(on?'Tags off.':'Tags on. Update your Privacy page and CSP first.')}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;let changed=false;
 if(d.c){st.theme.colors[st.pvMode][d.c]=t.value.toUpperCase();changed=true} if(d.ch&&/^#[0-9a-fA-F]{6}$/.test(t.value)){st.theme.colors[st.pvMode][d.ch]=t.value.toUpperCase();changed=true}
 if(d.br!==undefined){st.buttons.radius_px=+t.value>=60?999:+t.value;changed=true} if(d.nl!==undefined){st.nav.items[+d.nl].label=t.value;changed=true}
 if(d.nt!==undefined){const i=st.nav.items[+d.nt];let a=st.nav.mobile_tabs;if(t.checked){if(a.length>=4){t.checked=false;return toast('The bottom bar holds 4.')}a.push(i.id)}else a=st.nav.mobile_tabs=a.filter(x=>x!==i.id);changed=true}
 if(t.id==='bname'){st.brand.name=t.value||'Site';changed=true} if(d.p){st.pop[d.p]=t.value;draw();return} if(t.id==='q')return drawTiles();
 if(changed){st.dirty=true;draw()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.k){st.theme[d.k]=t.value;st.dirty=true;draw()} if(t.id==='prov'){st.tr.email=t.value;draw()} if(t.id==='role'){st.role=t.value;st.tabs=null;if(!mods().some(m=>m.id===st.page))st.page=mods()[0].id;drawShell();draw()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open'))closeSheet()});
matchMedia('(max-width:1024px)').addEventListener('change',()=>{closeSheet();drawShell()});
drawShell();draw();
